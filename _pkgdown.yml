# The site occupies `docs/` directly. The sibling *scales packages nest theirs
# under `docs/r/` because they expect Python and C++ implementations alongside;
# reneuro is an R package only, so there is nothing to disambiguate.
#
# GitHub Pages serves `docs/` from the default branch. The site is built locally
# and committed -- there is no pkgdown workflow. Build it with
# `Rscript pkgdown/build.R`, not `pkgdown::build_site()`: the script works
# around an older installed `reneuro` shadowing this source tree.
url: https://optimal2050.github.io/reneuro/

# The default footer carries a "Developed by <authors>." line on every page;
# authorship belongs on the home page and in DESCRIPTION, not under each
# article. `left` must name a component -- an empty YAML list reaches pkgdown
# 2.2.1 as a list and fails every page with "invalid subscript type" -- so it
# points at a component defined as empty text.
footer:
  structure:
    left: blank
    right: built_with
  components:
    blank: ""

template:
  bootstrap: 5
  light-switch: true
  includes:
    # Figure numbering + cross-references for article pages. Every figure
    # (div.figure with a caption) gets a "Figure N:" prefix and an id
    # derived from its image filename ("fig-<basename>"); links written as
    # [Figure](#fig-<basename>) get their text filled with the number.
    after_body: >
      <script>
      document.addEventListener("DOMContentLoaded", function () {
        var n = 0, ids = {};
        document.querySelectorAll("div.figure, figure").forEach(function (fg) {
          var img = fg.querySelector("img");
          var cap = fg.querySelector(".caption, figcaption");
          if (!img || !cap) return;
          n += 1;
          var src = (img.getAttribute("src") || "").split("/").pop();
          var dot = src.lastIndexOf(".");
          if (dot > 0) src = src.slice(0, dot);
          var base = src.replace(/[^a-zA-Z0-9_-]/g, "-");
          if (base && !fg.id) fg.id = "fig-" + base;
          ids[fg.id] = n;
          var tag = document.createElement("span");
          tag.className = "fig-number";
          tag.textContent = "Figure " + n + ": ";
          cap.insertBefore(tag, cap.firstChild);
        });
        document.querySelectorAll('a[href^="#fig-"]').forEach(function (a) {
          var k = a.getAttribute("href").slice(1);
          if (ids[k]) a.textContent = "Figure " + ids[k];
        });
      });
      </script>
  # The site takes its palette from the logo (man/figures/logo.png): EU blue
  # #003399 and EU gold #FFCC00, the two colours the mark is drawn in. This
  # leaves the *scales one-hue-per-sibling scheme deliberately -- reneuro is a
  # model package rather than a scales twin, and a magenta site framing a
  # blue-and-gold mark read as two different projects.
  #
  # Gold is 1.51:1 on white, so it is never text; pkgdown/extra.css uses it as
  # a fill, an underline and a rule, and that file also carries the navbar
  # foreground and the dark-mode link, neither of which bslib gets right here.
  #
  # NOTE `navbar: bg:` / `navbar: type:` do NOT work with `light-switch: true`
  # (pkgdown customise.Rmd:255) -- the navbar colour has to come through
  # `navbar-bg` below. The sibling sites set `navbar: bg: primary` under
  # light-switch, which is why their navbars still render default grey.
  bslib:
    primary: "#003399"
    secondary: "#FFCC00"
    link-color: "#003399"
    navbar-bg: "#003399"   # light mode; dark mode goes slate grey in extra.css

# Pinned rather than `auto`: with `auto`, the first released version silently
# switches pkgdown to devel mode and relocates the whole site into `r/dev/`.
development:
  mode: unreleased
  version_label: danger

# Convention: figures are built on a SOLID background -- transparent PNGs are
# illegible in the site's dark mode. pkgdown/extra.scss then stops the dark
# theme inverting them (see optimal2050 CONVENTIONS.md).
figures:
  bg: "white"

home:
  sidebar:
    structure: [links, license, citation, toc]

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]

# reference: is added as the package gains exported functions. pkgdown validates
# both indexes for completeness, so an entry must exist for every exported topic
# once there are any.
#
# vignettes/reneuro.Rmd is the intro ("Get started") by pkgdown convention --
# named after the package -- so it is not listed here.
articles:
- title: Articles
  navbar: ~
  contents:
  - reneuro
  - translation
  - data
  - articles/data-sources
  - articles/wind-potential
  - articles/solar-potential
  - articles/scenarios
  - articles/report-model
  - articles/report-scenario
  - articles/gpu-solving
  - about
